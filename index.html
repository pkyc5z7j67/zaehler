<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zähler"><title>Mein Zähler</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#172033}.card{box-sizing:border-box;width:min(90vw,390px);padding:36px 24px;border-radius:26px;background:white;box-shadow:0 12px 45px #1d355715;text-align:center}h1{font-size:25px;margin:0 0 24px}#zahl{font-size:92px;font-weight:750;font-variant-numeric:tabular-nums;margin:8px 0 28px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:16px 22px}#plus{width:100%;background:#2463eb;color:white;font-size:22px;font-weight:650}#reset{margin-top:16px;background:#e9edf5;color:#26334b}p{font-size:13px;color:#657084;margin:24px 0 0}</style></head><body><main class="card"><h1>Mein erster Zähler</h1><div id="zahl" aria-live="polite">0</div><button id="plus">+ 1</button><button id="reset">Zurücksetzen</button><p>Der Zähler wird auf diesem Gerät gespeichert.</p></main><script>const key='mein-zaehler-v1';let n=0;try{n=Math.max(0,Number(localStorage.getItem(key))||0)}catch(e){}const el=document.getElementById('zahl');function show(){el.textContent=n;try{localStorage.setItem(key,String(n))}catch(e){}}document.getElementById('plus').addEventListener('click',()=>{n++;show()});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Zähler wirklich auf 0 setzen?')){n=0;show()}});show();</script></body></html>
